# Render static site Blueprint.
# Use this file as the Blueprint Path if Render's current setup page cached an older render.yaml.
services:
  - type: web
    name: sara-beauty-artistry
    runtime: static
    plan: free
    branch: main
    buildCommand: ""
    staticPublishPath: .
    previews:
      generation: automatic
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
